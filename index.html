<script>

// Configuration de la carte

// ORTHOPHOTO
var map = new mapboxgl.Map({
container: 'map',
style: 'mapbox://styles/mapbox/satellite-streets-v12',
center: [6.1753, 44.06335],// Coordonnée en degré décimal 
zoom: 12, // zoom
pitch: 50, // Inclinaison
bearing:31 // Rotation
});
// Ce code génère la carte interactive dans la page et lui donne son apparence de départ, ici une vue satellite. Il positionne également la caméra pour que la carte s'ouvre pile sur la Bléone proche de Digne-les-Bains, avec une inclinaison (pitch) et une rotation (bearing) pour donner un effet 3D.


// Ecouteur du menu Select des fonds de carte
document.getElementById('basemap-select').addEventListener('change', function(e) {
    var newStyle = e.target.value;

    // Récupération des paramètres actuels de la caméra
    var currentCamera = {
        center: map.getCenter(),
        zoom: map.getZoom(),
        pitch: map.getPitch(),
        bearing: map.getBearing()
    };

    // Changer de style
    map.setStyle(newStyle);

    // Une fois le nouveau style chargé, ce code réapplique la position de la caméra et recharge toutes les couches
    map.once('style.load', function() {
        map.jumpTo(currentCamera);
        addAllLayers(); // Réappliquer toutes les couches après le changement de style
    });
});
// Ce code permet de changer le fond de carte de manière fluide. Son rôle crucial est de mémoriser exactement où on regardait (zoom, inclinaison, position) avant le changement pour rétablir cette vue immédiatement après. Sans cela, la carte risquerait de se réinitialiser et se renvoyer au point de départ à chaque changement de style.
	

// *** 1. APPEL DES COUCHES *** //

	// AJout de donnees OSM

// Fonction pour ajouter toutes les couches
function addAllLayers() {
	map.addSource('mapbox-dem', { // Définition de la source de donnée
				'type': 'raster-dem',
				'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',  // On ajoute le MNE à notre carte
				'tileSize': 512,
				'maxzoom': 14
			});
     // Ajout du MNE et spécification de l'éxagération
     map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 }); // On ajoute une exagération de 1.5 pour la rendre réaliste, si on veut travailler sans que les icônes disparaissent, il faut mettre en commentaire ce map.setTerrain
    
	// Ce code transforme la carte plate en une carte en 3D en y ajoutant le relief grâce à des données d'altitude. Il configure aussi une exagération verticale (x1.5) pour que les pentes paraissent plus prononcées et le paysage plus lisible à l'écran.


	// Ajout de l'occupation du sol (RPG)
	map.addSource('RPG', { 
		type: 'vector',
		url: 'mapbox://dabo22.b21llohm'}); // Id du tileset de Mapbox
			
		map.addLayer({
		'id': 'RPG', // Donner le nom que l'on souhaite
		'type': 'fill',
		'source': 'RPG', //Donner le nom que l'on souhaite
		'source-layer':'RPG_ASAs_4326-9y53t2',
		'layout': {'visibility': 'none'},
		'paint': {
			'fill-color': [
				'match',
				['get', 'Classeur10'],
				'ARBORICULTURE', '#F79B8F', // Rouge
				'CÉRÉALES', '#EDBB47', // Jaune
				'MARAICHAGE', '#266E3D', // Bleu
				'OLÉAGINEUX', '#73520B', // Vert
				'PAPAM', '#C193C9', // Magenta
				'PRAIRIES', '#9BC993', // Cyan
				'#808080' // Couleur par défaut (gris)
				],
			'fill-opacity': 0.6
		}
		});
// Ce code charge les données des parcelles agricoles (RPG) et les colorie automatiquement selon le type de culture (jaune pour les céréales, rouge pour les arbres, etc) grâce à une règle de style conditionnelle (match). Il configure cette couche pour qu'elle soit masquée par défaut (visibility: none) au chargement de la page, afin de ne pas surcharger la carte tant que l'utilisateur ne l'a pas demandée.
		

	// Ajout du périmètre des ASA
	map.addSource('asa', {
	type : 'vector',
	url : 'mapbox://dabo22.c1xfg5g8'});

	map.addLayer({
	'id': 'asa',
	'type': 'fill',
	'source': 'asa',
	'source-layer':'perimetre_asa_4326-d6053d',
	'layout': {'visibility': 'none'},
	'paint': {
		'fill-color': [
			'match',
			['get', 'nom'],
			// Remplacez les valeurs ci-dessous par les noms réels présents dans votre champ "nom"
			'ASA du Canal de la Plaine de Gaubert', '#f94144',
			'ASA du canal de la Grande Iscle', '#f3722c',
			'ASA Canal du Nigas', '#90be6d',
			/* valeur par défaut */ '#577590'
			],
		'fill-opacity': 0.45,
		'fill-outline-color': '#333333'
	},
	});
	//Ce code ajoute les périmètres des ASA sur la carte en coloriant chaque secteur différemment selon son nom pour bien les distinguer visuellement. Il configure aussi leur transparence pour laisser voir le fond de plan et garde ces zones masquées par défaut tant que l'utilisateur ne les active pas.


	// Ajout itineraire randos pédestre, VTT, équestre au PDIPR

	type: 'vector',
	url: 'mapbox://dabo22.cd4kvjsz'}); // Id du tileset de Mapbox
			
	map.addLayer({
	'id': 'itineraire', // Donner le nom que l'on souhaite 
	'type': 'line',
	'source': 'itineraire', // Donner le nom que l'on souhaite 
	'source-layer':'pdipr-7c2ley',
	'layout': {'visibility': 'none', 'line-join': 'round','line-cap': 'round'},
	'paint': {'line-width': 2, 'line-color': 'red',} // line-width et line-color quand le type est line, la couleur est rouge  
	});
	//Ce code ajoute les itinéraires de randos pédestres, VTT et équestre au PDIPR sur la carte en mettant son tracé en rouge. Il configure aussi leur transparence pour laisser voir le fond de plan et garde ces zones masquées par défaut tant que l'utilisateur ne les active pas.


	// Ajout route bleue de la bléone

	'source': 'route-bleue', // Donner le nom que l'on souhaite 
	'source-layer':'sentier_touriste-76oftq',
	'layout': {'visibility': 'none', 'line-join': 'round','line-cap': 'round'},
	'paint': {'line-width': 2, 'line-color': 'yellow',} // bien mettre line-width et line-color quand le type est line, la couleur est jaune  
	});
	//Ce code ajoute la route bleue de la bléone sur la carte en mettant son tracé en jaune. Il configure aussi leur transparence pour laisser voir le fond de plan et garde ces zones masquées par défaut tant que l'utilisateur ne les active pas.
	

	// Ajout des canaux d'irrigation de la Bléone

	map.addSource('bleone', { 
	type: 'vector',
	url: 'mapbox://dabo22.83ztmm3k'}); // Id du tileset de Mapbox 			
	map.addLayer({
	'id': 'bleone', // Donner le nom que l'on souhaite 		
	'type': 'line',
	'source': 'bleone', // Donner le nom que l'on souhaite 
	'source-layer':'canaux_4326-57pv00',
	'layout': {'visibility': 'none', 'line-join': 'round','line-cap': 'round'},
	'paint': {'line-width': 2, 'line-color': [
			'match',
			['get', 'lib_type'],
			'primaire', '#1f77b4',
			'secondaire', '#17becf',
			'souterrain', '#9edae5',
			/* valeur par défaut */ '#aec7e8'
	],} // line-width et line-color quand le type est line, la couleur est différente en fonction du type de canal.
	});
	//Ce code ajoute les canaux d'irrigation de la Bléone sur la carte en mettant son tracé en fonction du type de canal. Il configure aussi leur transparence pour laisser voir le fond de plan et garde ces zones masquées par défaut tant que l'utilisateur ne les active pas.


		// *** EQUIPEMENTS ***

		//Equipement des ASA Bléone !!!!

	map.addSource('eqpmt', {

		'source-layer': 'building',
		'layout': {'visibility': 'none'},
		'filter': ['==', 'extrude', 'true'],
		'type': 'fill-extrusion', // On extrude les batiments //
		'minzoom': 15, // Le zoom minimal pour voir les bâtiments 3D est défini à 15 //
		'paint': {'fill-extrusion-color': '#555555', 'fill-extrusion-height': 
		{'type': 'identity','property': 'height'},
		'fill-extrusion-base': {'type': 'identity','property': 'min_height'},
		'fill-extrusion-opacity': 0.8
		}
		});	
			
		
			 
			// Ajout des bâtiments 
		
			map.addLayer({
			"id": "batiments", // On ne prend que les éléments dont l'id est "batiments" //
			"type": "fill", 
			"source": "mapbox-streets-v8",
			"source-layer": "building",
			'layout': {'visibility': 'none'},
			"paint": {"fill-color": "#FEFEFE", // Couleur des bâtiments définie par le code '#FEFEFE' soit un léger gris*//
			"fill-opacity": 0.8} // L'opacité des bâtiments est de 80% //
			});


		// Configuration de la couche route

		map.addLayer({ //On appel ici la couche de données des routes issues d’OSM 

		"id": "Routes",  // On ne prend que les éléments dont l'id est "routes" //
		"type": "line",  // Les éléments seront de type 'ligne' //
		"source": "mapbox-streets-v8",
		"layout": {'visibility': 'none'},
		"source-layer": "road",
		'layout': {'visibility': 'none'},
		"filter": ["all",  ["in", "track", "street"]],   //On peut filtrer uniquement avec l'attribut "filter" les pistes forestières "track" et les petites voies "street", regarder toutes les options dans la doc Mapbox https://docs.mapbox.com/data/tilesets/reference/mapbox-streets-v8/#road
		"paint": {"line-color": "#FF7F50", "line-width": 1} // On définit la couleur des route à orange selon le code hexadécimal #FF7F50 //
		});
			


	// *** 2. FONCTIONS *** //
		
	 switchlayer = function (lname) {	
    if (document.getElementById(lname + "CB").checked) {
        map.setLayoutProperty(lname, 'visibility', 'visible');
        // Affiche la légende RPG si la couche RPG est activée
        if (lname === 'RPG') {
            document.getElementById('legend-rpg').style.display = 'block';
        }
    } else {
        map.setLayoutProperty(lname, 'visibility', 'none');
        // Masque la légende RPG si la couche RPG est désactivée
        if (lname === 'RPG') {
            document.getElementById('legend-rpg').style.display = 'none';
        }
       }
     }
	// Ce code permet de basculer la visibilité des couches sur la carte en fonction de l'état des cases à cocher dans le menu. Il gère aussi l'affichage conditionnel de la légende pour l'occupation du sol en la montrant uniquement lorsque cette couche est activée.			
			
			// Geocoder
			const geocoder = new MapboxGeocoder({
			accessToken: mapboxgl.accessToken,
			language: 'fr-FR', // Spécifie le français.
			mapboxgl: mapboxgl
			});
			map.addControl(geocoder, 'bottom-right');	
				
		
			// Ajout boutons navigation a la fin du script
			var nav = new mapboxgl.NavigationControl();
			map.addControl(nav, 'top-left');
						
						
			// Ajout Echelle cartographique a la fin du script
			map.addControl(new mapboxgl.ScaleControl({
			maxWidth: 120,
			unit: 'metric'}));
			
			
			//*** 3. INTERACTIVITE UTILISATEUR ***//
			
			//Intéractivité lors du clic sur la couche des réseaux d'irrigation de la Bléone
			map.on('click', function (e) { //Evenement au clic sur la couche bleone 
			var features = map.queryRenderedFeatures(e.point, { layers: ['bleone'] });
			if (!features.length) {
			return;
			}
			var feature = features[0];
			var popup = new mapboxgl.Popup({ offset: [0, -15] })
			.setLngLat(e.lngLat)
			.setHTML('<h3>' + feature.properties.lib_type + '</h3>') //Je lui fait afficher la valeur dans le champ nom de mon shp dans le Tileset Mapbox
			.addTo(map);
			});
			//Récupérer l’objet cliqué dans la couche, cherche les entités affichées exactement sous le clic, mais uniquement dans la couche bleone.
            //Affiche la couche bleone sous le clic, récupère sa propriété lib_type et l’affiche dans une popup positionnée à l’endroit exact du clic

			// Interactivité au survol de la couche des réseaux d'irrigation de la Bléone (affiche le type de canal)
			var bleoneHoverPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });
			map.on('mouseenter', 'bleone', function() {
				map.getCanvas().style.cursor = 'pointer';
			});
			map.on('mouseleave', 'bleone', function() {
				map.getCanvas().style.cursor = '';
				bleoneHoverPopup.remove();
			});
			map.on('mousemove', 'bleone', function(e) {
				var feature = e.features && e.features[0];
				if (!feature) { bleoneHoverPopup.remove(); return; }
				var name = feature.properties && feature.properties.lib_type ? feature.properties.lib_type : 'ASA';
				bleoneHoverPopup.setLngLat(e.lngLat)
					.setHTML('<strong>' + name + '</strong>')
					.addTo(map);
			});
			//Lors du clic sur les couches réseaux d'irrigations, cela affiche les noms instantanément dans l'infobulle et la bulle disparaît dès que la souris s'éloigne. 

			
			// Interactivité au survol de la couche ASA (affiche le nom)
			var asaHoverPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });
			map.on('mouseenter', 'asa', function() {
				map.getCanvas().style.cursor = 'pointer';
			});
			map.on('mouseleave', 'asa', function() {
				map.getCanvas().style.cursor = '';
				asaHoverPopup.remove();
			});
			map.on('mousemove', 'asa', function(e) {
				var feature = e.features && e.features[0];
				if (!feature) { asaHoverPopup.remove(); return; }
				var name = feature.properties && feature.properties.nom ? feature.properties.nom : 'ASA';
				asaHoverPopup.setLngLat(e.lngLat)
					.setHTML('<strong>' + name + '</strong>')
					.addTo(map);
			});
			//Lors du clic SUR les different ASA le script récupère la première entité sous la souris, lit la propriété et positionne le popup à la position du pointeur. Cela affiche au final le nom en gras dans le popup.

			// Interactivité au survol de la couche RPG (affiche Classeur10)
			var RPGHoverPopup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });
			map.on('mouseenter', 'RPG', function() {
				map.getCanvas().style.cursor = 'pointer';
			});
			map.on('mouseleave', 'RPG', function() {
				map.getCanvas().style.cursor = '';
				RPGHoverPopup.remove();
			});
			map.on('mousemove', 'RPG', function(e) {
				var feature = e.features && e.features[0];
				if (!feature) { RPGHoverPopup.remove(); return; }
				var name = feature.properties && feature.properties.Classeur10 ? feature.properties.Classeur10 : 'type';
				RPGHoverPopup.setLngLat(e.lngLat)
					.setHTML('<strong>' + name + '</strong>')
					.addTo(map);
			});
			// Au clique sur la couche RPG, cela place le popup à l’endroit où est la souris, met comme texte dedans, la valeur du RPG, écrit en gras, puis montre le popup sur la carte.


			// --- Réinitialiser les checkboxes au chargement de la page
			function resetCheckboxes() {
				var cbs = document.querySelectorAll('.map-overlay-inner input[type="checkbox"]');
				cbs.forEach(function(cb) {
					try { cb.checked = false; } catch (e) { }
				});

				// Synchroniser la visibilité des couches si la carte est prête
				if (typeof map !== 'undefined' && map && typeof map.getLayer === 'function') {
					cbs.forEach(function(cb) {
						var layer = cb.value;
						try {
							if (map.getLayer(layer)) map.setLayoutProperty(layer, 'visibility', 'none');
						} catch (e) {
							}
					});
				}
			}
			//Affiche toute les cases à cocher à zéro et masque les couches correspondantes sur la carte de sorte que lors du clic sur "Reset", les cases se vident et les couches disparaissent sur la carte.

			// Appeler au chargement et après un court délai (au cas où les layers soient ajoutés plus tard)
			window.addEventListener('load', function() {
				resetCheckboxes();
				setTimeout(resetCheckboxes, 600);
			});

}

// Appeler la fonction au chargement initial de la carte
map.on('load', function() {
	addAllLayers();
});
